[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "docs-site/src/snippets/**",
  "docs-site/dist/**",
  "docs-site/.astro/**",
  "docs-site/src/content/docs/reference/**",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "coverage/**",
  "dist/**",
  "node_modules/**",
  "packages/go/generated_api.go",
  "packages/go/generated_pro.go",
  "packages/go/generated_backend.go",
  "packages/go/oapi-codegen-backend.gen.yaml",
  "packages/go/spec-backend.gen.yaml",
  "packages/go/oapi-codegen-pro.gen.yaml",
  "packages/go/spec-pro.gen.yaml",
  "packages/python/src/xberg_io_sdk/_generated_api/**",
  "packages/python/src/xberg_io_sdk/_generated_pro/**",
  "packages/typescript/src/_generated/**",
  "spec/**",
  "spec/openapi.yaml/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[per-file-ignores]
# --- quality-debt baseline round 2 ---
# 5 size/complexity findings across 4 files that predate these
# metrics. Listed per file rather than switching the rules off, so the metrics still
# fire on every file NOT listed here -- new code stays covered, and each path below is
# one discrete unit of work.
# TODO(quality-debt): pay this down file by file and delete each entry as it goes green.
# Do not add new paths here without a very good reason. ~keep
"packages/go/extract_test.go" = ["function-too-long"]
"packages/go/jobs_test.go" = ["cyclomatic-complexity"]
"packages/python/src/xberg_io_sdk/client.py" = ["file-too-long", "type-too-long"]
# ~keep The unified public client already exceeds the file limit within its class;
# retain its API shape while tracking size debt only for this existing file.
"packages/typescript/src/client.ts" = ["file-too-long", "type-too-long"]
# --- end quality-debt baseline ---
# Stylistic rules disabled repo-wide. Each is a formatting or idiom preference with no
# correctness or security consequence, and each fires in volumes no one can hand-maintain
# (`require-unicode-regexp` alone was 724 across the polyrepo, `no-inline-comments` 200).
# `eqeqeq` is here for a stronger reason: every occurrence audited was the deliberate
# `== null` nullish idiom, so the rule had a 100% false-positive rate here.
# Rules with a real correctness or security angle are deliberately NOT listed and stay on:
# unicorn/require-post-message-target-origin, unicorn/no-array-callback-reference,
# unicorn/no-immediate-mutation, unicorn/no-array-fill-with-reference-type. ~keep
"**" = [
  "CPY001",
  "UnorderedKey",
  "eqeqeq",
  "no-inline-comments",
  "no-negated-condition",
  "require-unicode-regexp",
  "unicorn/consistent-function-scoping",
  "unicorn/escape-case",
  "unicorn/explicit-length-check",
  "unicorn/new-for-builtins",
  "unicorn/no-array-sort",
  "unicorn/no-hex-escape",
  "unicorn/no-lonely-if",
  "unicorn/no-negated-condition",
  "unicorn/no-typeof-undefined",
  "unicorn/no-useless-undefined",
  "unicorn/prefer-add-event-listener",
  "unicorn/prefer-at",
  "unicorn/prefer-code-point",
  "unicorn/prefer-dom-node-append",
  "unicorn/prefer-dom-node-remove",
  "unicorn/prefer-import-meta-properties",
  "unicorn/prefer-native-coercion-functions",
  "unicorn/prefer-number-coercion",
  "unicorn/prefer-query-selector",
  "unicorn/prefer-single-call",
  "unicorn/prefer-string-replace-all",
  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
"**/tests/**/*.*" = [
  "A005",
  "ANN",
  "ARG001",
  "ARG002",
  "ASYNC230",
  "BLE001",
  "D",
  "N806",
  "N815",
  "PGH003",
  "PLC",
  "PLR0915",
  "PLR2004",
  "PT006",
  "PT007",
  "PT013",
  "PT017",
  "PT031",
  "RUF012",
  "S",
  "SIM117",
  "SLF001",
  # The `fetch` and `sleep` test doubles are contextually typed against `typeof fetch`
  # and the client's `sleep` option, both of which must return a Promise. Here `async` IS
  # the return type, not a superfluous keyword -- dropping it is a type error and adding a
  # token `await Promise.resolve()` only obscures the stub. Production code is not exempt:
  # every `require-await` in packages/typescript/src was fixed with a real `await`. ~keep
  "require-await",
]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"docs/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]

[lint.python.ruff]
pydocstyle_convention = "google"
mccabe_max_complexity = 15
pylint_max_args = 10
pylint_max_branches = 15
pylint_max_returns = 10
known_first_party = ["xberg_io_sdk"]
select = ["ALL"]
ignore = [
  "ANN401",
  "ASYNC109",
  "ASYNC110",
  "BLE001",
  "COM812",
  # ~keep Swept in by select = ["ALL"], which no other xberg-io repo uses — they select a
  # curated list instead, so CPY001 fires here and nowhere else. The org ships LICENSE
  # files rather than per-file copyright headers, so satisfying it would mean adding
  # headers to every .py file in this repo alone.
  "CPY001",
  "D100",
  "D104",
  "D107",
  "D205",
  "E501",
  "EM",
  "FBT",
  "FIX",
  "ISC001",
  "PD011",
  "PGH003",
  "PLR2004",
  "PLW0603",
  "S104",
  "S110",
  "S603",
  "TD",
  "TRY",
]

[lint.markdown.rumdl]
disable = ["MD013", "MD033", "MD041"]


[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]
[fmt.markdown.rumdl]
disable = ["MD013", "MD033", "MD041"]

