name: spec-sync

# Cross-repo spec alignment. Primary trigger is release-driven: xberg-enterprise's
# release pipeline sends a `repository_dispatch` (type: spec-updated) carrying the
# released API version, and this workflow opens a regenerate-and-commit PR pinned to
# that version. The weekly cron is a fallback safety net; workflow_dispatch is manual.
on:
  repository_dispatch:
    types: [spec-updated]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # The weekly cron, a release-driven repository_dispatch and a manual run can all
  # fire close together; without a group two syncs race on the same regenerate
  # branch. Never cancelled: a run that is interrupted after committing but before
  # opening its PR leaves the branch half-written, so a second run queues instead.
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: refresh vendored OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: |
            sdks
            xberg-enterprise

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Resolve upstream ref
        # ~keep The fallback is `development`, NOT `main`. `development` is xberg-enterprise's
        # default branch and where its spec work actually lands; `main` is a deploy-only
        # promotion target that trails it by hundreds of commits. Defaulting to `main` is why
        # this workflow reported zero drift for weeks while the SDKs went stale: it was
        # faithfully syncing a branch nobody develops on. Worse, `main`'s Pro spec carries no
        # control plane at all -- no /v1/projects, no /v1/projects/{id}/api-keys -- so an SDK
        # generated from it cannot even mint the API key needed to authenticate against Pro.
        # A release dispatch still wins via client_payload.ref. ~keep
        id: ref
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          echo "ref=${PAYLOAD_REF:-development}" >> "$GITHUB_OUTPUT"
          echo "version=${PAYLOAD_VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Checkout sibling xberg-enterprise
        uses: actions/checkout@v7
        with:
          repository: xberg-io/xberg-enterprise
          path: _xberg-enterprise
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          # ~keep Pinned: releases/latest resolves at run time, so an upstream release
          # lands here unreviewed. That is how scythe v0.14.0 broke xberg-enterprise CI.
          # yq drives the spec conversion below, so a formatting change upstream would
          # show up as spurious spec drift. Bump deliberately.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Normalise all three upstream specs into the vendored copies
        run: |
          yq -P -oy '.' \
            _xberg-enterprise/services/api/spec/openapi.json \
            > spec/api/openapi.yaml
          yq -P -oy '.' \
            _xberg-enterprise/services/pro/spec/openapi.json \
            > spec/pro/openapi.yaml
          # The control plane's spec is vendored by the frontend and is already
          # YAML; it still goes through yq so all three copies share one
          # formatting and a drift diff stays readable.
          yq -P -oy '.' \
            _xberg-enterprise/frontend/openapi-backend.yaml \
            > spec/backend/openapi.yaml

      - name: Detect drift
        id: diff
        run: |
          if git diff --quiet -- spec/api/openapi.yaml spec/pro/openapi.yaml spec/backend/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(spec): sync api + pro + backend openapi specs from xberg-enterprise (${{ steps.ref.outputs.version }})"
          title: "chore(spec): sync openapi specs from xberg-enterprise (${{ steps.ref.outputs.version }})"
          body: |
            Automated sync of `spec/api/openapi.yaml`, `spec/pro/openapi.yaml` and
            `spec/backend/openapi.yaml` from `xberg-io/xberg-enterprise@${{ steps.ref.outputs.ref }}`
            (`services/api/spec/openapi.json` + `services/pro/spec/openapi.json` +
            `frontend/openapi-backend.yaml`).

            API version: `${{ steps.ref.outputs.version }}`

            Per-language CI (ci-python / ci-typescript / ci-go) regenerates clients from
            these specs and runs the full test suite on this PR — that is the consistency
            gate. Review per-language diffs before merging.
          branch: chore/spec-sync
          delete-branch: true
          add-paths: |
            spec/api/openapi.yaml
            spec/pro/openapi.yaml
            spec/backend/openapi.yaml
