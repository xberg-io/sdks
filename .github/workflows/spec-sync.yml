name: spec-sync

# Cross-repo spec alignment. Primary trigger is release-driven: xberg-enterprise's
# release pipeline sends a `repository_dispatch` (type: spec-updated) carrying the
# ref and version (`{"ref": "pro-vX.Y.Z", "version": "X.Y.Z"}`), and this workflow opens a
# regenerate-and-commit PR on a per-ref branch, recording the ref and the resolved upstream
# commit. The weekly cron is a fallback safety net; workflow_dispatch is manual.
on:
  repository_dispatch:
    types: [spec-updated]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # The weekly cron, a release-driven repository_dispatch and a manual run can all
  # fire close together; without a group two syncs race on the same regenerate
  # branch. Never cancelled: a run that is interrupted after committing but before
  # opening its PR leaves the branch half-written, so a second run queues instead.
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: refresh vendored OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: |
            sdks
            xberg-enterprise

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream ref
        # ~keep The fallback is `development`, NOT `main`. `development` is xberg-enterprise's
        # default branch and where its spec work actually lands; `main` is a deploy-only
        # promotion target that trails it by hundreds of commits. Defaulting to `main` is why
        # this workflow reported zero drift for weeks while the SDKs went stale: it was
        # faithfully syncing a branch nobody develops on. Worse, `main`'s Pro spec carries no
        # control plane at all -- no /v1/projects, no /v1/projects/{id}/api-keys -- so an SDK
        # generated from it cannot even mint the API key needed to authenticate against Pro.
        # A release dispatch still wins via client_payload.ref. ~keep
        id: ref
        env:
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: task spec:sync:resolve

      - name: Checkout sibling xberg-enterprise
        uses: actions/checkout@v7
        with:
          repository: xberg-io/xberg-enterprise
          path: _xberg-enterprise
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve upstream commit
        id: upstream
        run: task spec:sync:sha

      - name: Install yq
        run: |
          # ~keep Pinned: releases/latest resolves at run time, so an upstream release
          # lands here unreviewed. That is how scythe v0.14.0 broke xberg-enterprise CI.
          # yq drives the spec conversion below, so a formatting change upstream would
          # show up as spurious spec drift. Bump deliberately.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Normalise all three upstream specs into the vendored copies
        run: task spec:fetch
        env:
          XBERG_ENTERPRISE_DIR: _xberg-enterprise

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.15.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync
          pnpm install --frozen-lockfile

      - name: Regenerate Python, TypeScript and Go clients
        run: task generate

      - name: Report spec coverage
        run: task spec:sync:coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/spec-coverage.txt

      - name: Compose pull request body
        run: task spec:sync:body
        env:
          REF: ${{ steps.ref.outputs.ref }}
          VERSION: ${{ steps.ref.outputs.version }}
          SHA: ${{ steps.upstream.outputs.sha }}
          COVERAGE_FILE: ${{ runner.temp }}/spec-coverage.txt
          BODY_FILE: ${{ runner.temp }}/spec-sync-body.md

      - name: Detect drift
        id: diff
        run: |
          if git diff --quiet -- spec/api/openapi.yaml spec/pro/openapi.yaml spec/backend/openapi.yaml \
            packages/go/generated_api.go packages/go/generated_pro.go packages/go/generated_backend.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            chore(spec): sync openapi specs from xberg-enterprise ${{ steps.ref.outputs.ref }}

            Upstream: xberg-io/xberg-enterprise ${{ steps.ref.outputs.ref }} at ${{ steps.upstream.outputs.sha }}
            Version: ${{ steps.ref.outputs.version }}
          title: "chore(spec): sync openapi specs from xberg-enterprise ${{ steps.ref.outputs.ref }}"
          body-path: ${{ runner.temp }}/spec-sync-body.md
          branch: ${{ steps.ref.outputs.branch }}
          delete-branch: true
          add-paths: |
            spec/api/openapi.yaml
            spec/pro/openapi.yaml
            spec/backend/openapi.yaml
            packages/go/generated_api.go
            packages/go/generated_pro.go
            packages/go/generated_backend.go
