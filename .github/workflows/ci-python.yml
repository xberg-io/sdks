name: ci-python

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/python/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/python.yml"
      - "scripts/**"
      - "Taskfile.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-python.yml"
  push:
    branches: [main]
    paths:
      - "packages/python/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/python.yml"
      - "scripts/**"
      - "Taskfile.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install ${{ matrix.python }}
      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install deps
        run: uv sync
      - name: Generate client
        run: task python:generate
      - name: Lint
        run: task python:lint
      - name: Test packaging and repository tooling
        run: task scripts:test
      - name: Test (with coverage)
        run: task python:test:cov
      - name: Build wheel + sdist
        run: task python:build
