name: ci-python

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/python/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "scripts/**"
      - "mise-tasks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-python.yml"
  push:
    branches: [main]
    paths:
      - "packages/python/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "scripts/**"
      - "mise-tasks/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor and the newest line, both locked in mise.ci.lock. ~keep
        python: ["3.10.22", "3.14.10"]
    env:
      MISE_ENV: ci
      MISE_PYTHON_VERSION: ${{ matrix.python }}
      UV_PYTHON: ${{ matrix.python }}
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python }}-
      - name: Install deps
        run: uv sync
      - name: Generate client
        run: mise run python:generate
      - name: Lint
        run: mise run python:lint
      - name: Test packaging and repository tooling
        run: mise run scripts:test
      - name: Test (with coverage)
        run: mise run python:test:cov
      - name: Build wheel + sdist
        run: mise run python:build
