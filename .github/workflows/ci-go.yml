name: ci-go

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "mise-tasks/go/**"
      - "scripts/**"
      - "tools/oapi-schemaset-config/**"
      - "go.work"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-go.yml"
  push:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "mise-tasks/go/**"
      - "scripts/**"
      - "tools/oapi-schemaset-config/**"
      - "go.work"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go 1.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go golangci-lint go:golang.org/x/vuln/cmd/govulncheck
      # setup-go cached the module and build caches; mise does not. ~keep
      - name: Resolve Go paths
        id: go-env
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "modcache=$(go env GOMODCACHE)"
            echo "cache=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go modules and builds
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.modcache }}
            ${{ steps.go-env.outputs.cache }}
          key: go-${{ runner.os }}-${{ steps.go-env.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go-env.outputs.version }}-
      - name: Build committed module consumer
        run: mise run go:test:package
      - name: Check generated client
        run: mise run go:check:generated
      - name: Lint
        run: mise run go:lint
      - name: Test (with coverage)
        run: mise run go:test:cov
