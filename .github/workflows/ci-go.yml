name: ci-go

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/go.yml"
      - "tools/oapi-schemaset-config/**"
      - "go.work"
      - ".github/workflows/ci-go.yml"
  push:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/go.yml"
      - "tools/oapi-schemaset-config/**"
      - "go.work"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go 1.26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Pinned, not @latest: a floating install means an upstream release can turn an
      # unrelated pull request red, and a scanner change alters the gate with no commit
      # to point at. The advisory database is still fetched fresh on every run.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Build committed module consumer
        run: task go:test:package
      - name: Check generated client
        run: task go:check:generated
      - name: Lint
        run: task go:lint
      - name: Test (with coverage)
        run: task go:test:cov
