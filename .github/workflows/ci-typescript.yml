name: ci-typescript

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/typescript.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/ci-typescript.yml"
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "tasks/typescript.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/ci-typescript.yml"

concurrency:
  group: ci-typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install deps
        run: pnpm install
      - name: Generate client
        run: task typescript:generate
      - name: Typecheck + lint
        run: task typescript:lint
      - name: Test (with coverage)
        run: task typescript:test:cov
      - name: Build
        run: task typescript:build
