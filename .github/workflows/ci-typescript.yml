name: ci-typescript

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-typescript.yml"
  push:
    branches: [main]
    paths:
      - "packages/typescript/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "spec/backend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-typescript.yml"

concurrency:
  group: ci-typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the baseline, both locked in mise.ci.lock. ~keep
        node-version: ["24.22.1", "26.12.1"]
    env:
      MISE_ENV: ci
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
      # setup-node cached the pnpm store. ~keep
      - name: Resolve the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install deps
        run: pnpm install
      - name: Generate client
        run: mise run typescript:generate
      - name: Typecheck + lint
        run: mise run typescript:lint
      - name: Test (with coverage)
        run: mise run typescript:test:cov
      - name: Build
        run: mise run typescript:build
