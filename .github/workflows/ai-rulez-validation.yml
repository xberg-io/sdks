name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - ".gitignore"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - ".gitignore"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-ai-rulez-validation.yml@v1
    with:
      budgets: |
        claude=5450
        codex=6200
