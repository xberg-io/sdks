name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - ".gitignore"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - ".gitignore"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "latest"
      - uses: xberg-io/actions/validate-ai-rulez@v1
      # ~keep Budgets: the --measure-mcp ai-rulez measurement plus about 5%; re-measure on every pin bump.
      - uses: xberg-io/agent-conventions/actions/context-exposure@v1
        with:
          budgets: |
            claude=4900
            codex=4400
