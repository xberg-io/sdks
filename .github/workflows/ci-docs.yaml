name: CI Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "spec/**"
      - "tasks/docs.yml"
      - "scripts/generate-reference.py"
      - "packages/python/src/**"
      - "packages/typescript/src/**"
      - "packages/go/*.go"
      - "pnpm-lock.yaml"
      - ".textlintrc.json"
      - ".textlintignore"
      - "package.json"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-docs.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "spec/**"
      - "tasks/docs.yml"
      - "scripts/generate-reference.py"
      - "packages/python/src/**"
      - "packages/typescript/src/**"
      - "packages/go/*.go"
      - "pnpm-lock.yaml"
      - ".textlintrc.json"
      - ".textlintignore"
      - "package.json"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - "toolchains.toml"
      - ".github/workflows/ci-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-docs-${{ github.ref }}
  # Pull-request builds only render the site, so a superseded one is waste and is
  # cancelled. A push to main runs the reusable workflow with `deploy: true`, and
  # cancelling an in-flight Pages deployment can leave it wedged part-published --
  # those always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The per-language reference pages are generated from the client sources by
  # scripts/generate-reference.py, which also fails when the three languages'
  # method surfaces diverge. Nothing in CI ran it, so a client change could land
  # a stale reference -- and a divergence -- without any job going red.
  reference:
    name: reference / Check generated pages
    runs-on: ubuntu-latest
    env:
      # The Python floor (requires-python >=3.10), locked in mise.ci.lock. ~keep
      MISE_ENV: ci
      MISE_PYTHON_VERSION: "3.10.22"
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv task
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.MISE_PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ env.MISE_PYTHON_VERSION }}-
      - name: Install deps
        run: uv sync
      - name: Fail if the generated API reference is stale
        run: task docs:reference:check

  docs:
    uses: xberg-io/actions/.github/workflows/reusable-docs-deploy.yml@v1
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
