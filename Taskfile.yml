version: "3"

# ============================================================================
# ============================================================================
# ============================================================================

includes:
  python:
    taskfile: ./tasks/python.yml
  typescript:
    taskfile: ./tasks/typescript.yml
    aliases: [ts]
  go:
    taskfile: ./tasks/go.yml
  spec:
    taskfile: ./tasks/spec.yml
  version:
    taskfile: ./tasks/version.yml
  pro:
    taskfile: ./tasks/pro.yml
  docs:
    taskfile: ./tasks/docs.yml

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  setup:
    desc: "Install all language toolchains"
    cmds:
      - uv sync
      - pnpm install
      - cd packages/go && go mod download
      - cd tools/oapi-schemaset-config && go mod download
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - poly hooks install

  generate:
    desc: "Regenerate all language clients from spec/api + spec/pro + spec/backend"
    cmds:
      - task: python:generate
      - task: typescript:generate
      - task: go:generate

  build:
    desc: "Build distributable artifacts for all languages"
    cmds:
      - task: python:build
      - task: typescript:build
      - task: go:build

  test:
    desc: "Run all language test suites"
    cmds:
      - task: python:test
      - task: typescript:test
      - task: go:test
      - task: scripts:test

  scripts:test:
    desc: "Run the contract tests for the repo tooling under scripts/"
    cmds:
      - uv run -m pytest scripts/tests -v

  lint:
    desc: "Lint all code via poly"
    cmds:
      - poly lint .

  lint:check:
    desc: "Alias for lint (check only)"
    cmds:
      - task: lint

  format:
    desc: "Format all code via poly"
    cmds:
      - poly fmt --fix .

  format:check:
    desc: "Check formatting via poly (no writes)"
    cmds:
      - poly fmt --check .

  fmt:
    desc: "Alias for format"
    cmds:
      - task: format

  validate:
    desc: "Run lint + tests for all languages (CI parity)"
    cmds:
      - task: lint
      - task: test
      # Catches a client surface that drifted between languages, and a reference
      # page left stale by a change to one. Both used to pass silently: the
      # generator skipped a method it could not find, so Go shipping
      # `DeleteDocuments` against `delete_rag_documents` elsewhere rendered three
      # clean pages and no error.
      - task: spec:coverage
      - task: docs:reference:check

  release:check:
    desc: "Pre-flight: version consistency, spec + reference drift, lint, test, build"
    cmds:
      - |
        version=$(cat VERSION)
        python3 -c "import re,sys;sys.exit(0 if re.match(r'^\d+\.\d+\.\d+([-+][\w.+-]+)?$','$version') else 1)" || { echo "VERSION '$version' is not valid semver" >&2; exit 1; }
        echo "version: $version"
      # A bump that half-applies is what broke the last release: four manifests
      # were written and the fifth raised, so the tag push failed
      # validate-versions. Check every manifest agrees before anything else runs.
      - python3 scripts/sync-versions.py --check
      - task: spec:check
      - task: docs:reference:check
      - task: lint
      - task: test
      - task: build
      - task: go:test:package
      - echo "ready to tag v$(cat VERSION)"

  release:tag:
    desc: "Create the unified release tag (vX.Y.Z) — refuses if working tree dirty"
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "working tree is dirty — commit or stash before tagging" >&2
          exit 1
        fi
        version=$(cat VERSION)
        tag="v$version"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "tag $tag already exists locally" >&2
          exit 1
        fi
        git tag -a "$tag" -m "Release $tag"
        echo "created tag $tag — push with: git push origin $tag"

  clean:
    desc: "Remove generated clients and build artifacts"
    cmds:
      - rm -rf packages/python/src/xberg_io_sdk/_generated_api packages/python/src/xberg_io_sdk/_generated_pro
      - rm -rf packages/python/src/xberg_io_sdk/_generated_backend
      - rm -rf packages/typescript/src/_generated
      - rm -f packages/go/oapi-codegen-pro.gen.yaml packages/go/spec-pro.gen.yaml
      - rm -f packages/go/oapi-codegen-backend.gen.yaml packages/go/spec-backend.gen.yaml
      - rm -rf packages/python/dist packages/typescript/dist
      - rm -rf .pytest_cache .mypy_cache .ruff_cache htmlcov coverage

  versions:sync:
    desc: "Propagate root VERSION to all language package manifests"
    cmds:
      - task: version:sync

  update:
    desc: "Alias for upgrade"
    cmds:
      - task: upgrade

  upgrade:
    desc: "Update dependencies and tool pins"
    cmds:
      - uv sync --upgrade
      - pnpm update -r
      - cd packages/go && go get -u ./... && go mod tidy
      - uvx --from gh-actions-updater gau --update .
