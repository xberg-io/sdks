  /v1/usage:
    get:
      tags:
        - usage
      summary: Get usage statistics and quota
      description: |-
        Reports page and document counts, broken down by MIME type, for the
        window named by `start`/`end` (each `YYYY-MM-DD`); with both omitted the
        window defaults to the current calendar month. `start` after `end` is a
        `400`. `quota_limit`/`quota_remaining` are `null` when the project has no
        monthly page quota (unlimited).
      operationId: get_usage
      parameters:
        - name: start
          in: query
          description: Start date (ISO 8601, e.g. "2026-03-01"). Defaults to first day of current month.
          required: false
          schema:
            type: string
        - name: end
          in: query
          description: End date (ISO 8601, e.g. "2026-04-01"). Defaults to first day of next month.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
              example:
                period_start: "2026-05-01"
                period_end: "2026-06-01"
                total_pages: 5432
                total_documents: 87
                total_failed: 2
                quota_limit: 100000
                quota_remaining: 94568
                by_mime_type:
                  application/pdf:
                    documents: 65
                    pages: 3200
                    failed: 1
                  image/png:
                    documents: 15
                    pages: 1800
                    failed: 0
                  text/plain:
                    documents: 7
                    pages: 432
                    failed: 1
        "400":
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
