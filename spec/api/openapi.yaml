          description: Maximum DPI threshold. Defaults to 600 when omitted.
        max_image_dimension:
          type:
            - integer
            - "null"
          format: int32
          description: Maximum image dimension (width or height). Defaults to 4096 when omitted.
        min_dpi:
          type:
            - integer
            - "null"
          format: int32
          description: Minimum DPI threshold. Defaults to 72 when omitted.
        target_dpi:
          type:
            - integer
            - "null"
          format: int32
          description: Target DPI for image normalization. Defaults to 300 when omitted.
      additionalProperties: false
    ImageKind:
      type: string
      description: Heuristic classification of what an image likely depicts.
      enum:
        - photograph
        - diagram
        - chart
        - drawing
        - text_block
        - decoration
        - logo
        - icon
        - tile_fragment
        - mask
        - page_raster
        - unknown
    ImageMetadata:
      type: object
      description: |-
        Image metadata extracted from image files.

        Includes dimensions, format, and EXIF data.
      required:
        - width
        - height
        - format
        - exif
      properties:
        exif:
          type: object
          description: EXIF metadata tags
          additionalProperties:
            type: string
          propertyNames:
            type: string
        format:
          type: string
          description: Image format (e.g., "PNG", "JPEG", "TIFF")
        height:
          type: integer
          format: int32
          description: Image height in pixels
          minimum: 0
        width:
          type: integer
          format: int32
          description: Image width in pixels
          minimum: 0
    ImageMetadataType:
      type: object
      description: Image element metadata.
      required:
        - src
        - image_type
        - attributes
      properties:
        alt:
          type:
            - string
            - "null"
          description: Alternative text from alt attribute
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValueAttribute'
          description: Additional attributes as key-value pairs.
        dimensions:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ImageDimensions'
              description: Image dimensions if available.
        image_type:
          $ref: '#/components/schemas/ImageType'
          description: Image type classification
        src:
          type: string
          description: Image source (URL, data URI, or SVG content)
        title:
          type:
            - string
            - "null"
          description: Title attribute
    ImagePreprocessingConfig:
      type: object
      description: |-
        Image preprocessing configuration for OCR.

        These settings control how images are preprocessed before OCR to improve
        text recognition quality. Different preprocessing strategies work better
        for different document types.
      properties:
        auto_rotate:
          type: boolean
          description: Auto-detect and correct image rotation.
          default: false
        binarization_method:
          type: string
          description: |-
            Binarization method: "none" (alias "off"), "otsu", "sauvola", or "adaptive".
            `deskew` must be `false` when this is `none` or `off`.
          default: otsu
        contrast_enhance:
          type: boolean
          description: |-
            Enhance contrast for better text visibility. With `none` or `off` binarization, this
            applies background normalization and sharpening while preserving grayscale pixels.
          default: false
        denoise:
          type: boolean
          description: Remove noise from the image.
          default: false
        deskew:
          type: boolean
          description: Correct skew (tilted images). Must be `false` with `none` or `off` binarization.
          default: true
        invert_colors:
          type: boolean
          description: Invert colors (white text on black → black on white).
          default: false
        target_dpi:
          type: integer
          format: int32
          description: Target DPI for the image (300 is standard, 600 for small text).
          default: 300
      additionalProperties: false
    ImagePreprocessingMetadata:
      type: object
      required:
        - original_dimensions
        - original_dpi
        - target_dpi
        - scale_factor
        - auto_adjusted
        - final_dpi
        - resample_method
        - dimension_clamped
        - skipped_resize
      properties:
        auto_adjusted:
          type: boolean
          description: Whether DPI was auto-adjusted based on content
        calculated_dpi:
          type:
            - integer
            - "null"
          format: int32
          description: Calculated optimal DPI (if auto_adjust_dpi enabled)
        dimension_clamped:
          type: boolean
          description: Whether dimensions were clamped to max_image_dimension
        final_dpi:
          type: integer
          format: int32
          description: Final DPI after processing
        new_dimensions:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/PixelDimensions'
              description: New dimensions after resizing (if resized).
        original_dimensions:
          $ref: '#/components/schemas/PixelDimensions'
          description: Original image dimensions in pixels.
        original_dpi:
          $ref: '#/components/schemas/ImageDpi'
          description: Original image resolution.
        resample_method:
          type: string
          description: Resampling algorithm used ("LANCZOS3", "CATMULLROM", etc.)
        resize_error:
          type:
            - string
            - "null"
          description: Error message if resize failed
        scale_factor:
          type: number
          format: double
          description: Scaling factor applied to the image
        skipped_resize:
          type: boolean
          description: Whether resize was skipped (dimensions already optimal)
        target_dpi:
          type: integer
          format: int32
          description: Target DPI from configuration
    ImageType:
      type: string
      description: Image type classification.
      enum:
        - data-uri
        - inline-svg
        - external
        - relative
