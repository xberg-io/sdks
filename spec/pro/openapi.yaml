      summary: Retrieve relevance-ranked chunks from a RAG collection
      description: |-
        `mode` selects the retrieval strategy: `vector` (requires `query` or a
        caller-supplied `query_vector`), `full_text` (requires `query`, rejects
        `query_vector`), or `hybrid` (requires `query`, combining both signals).
        `top_k` (1..=200) bounds the returned chunk count; `candidate_multiplier`
        (1..=20), when set, widens the pre-rerank candidate pool. `501` when the
        collection's configured reranker is not available in this deployment;
        `503` when the collection's concurrent-retrieve limit is exceeded.
      operationId: retrieve
      parameters:
        - name: name
          in: path
