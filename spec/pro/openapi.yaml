            maximum: 100
            minimum: 1
        - name: offset
          in: query
          description: Number of items to skip. A negative value is rejected with a 400; a value above 1,000,000 is accepted but clamped to 1,000,000.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: project_id
          in: query
          description: Project to read. Absent reads the credential's own project.
          required: false
          schema:
            type: string
            format: uuid
