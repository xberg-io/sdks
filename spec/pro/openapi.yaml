  /v1/projects/{project_id}/integrations/{integration_id}/documents:
    get:
      tags:
        - integrations
      summary: List documents visible through a connected source integration.
      description: |-
        Delegates to the integration's own connector, so behavior and pagination
        depend on the connected source (Google Drive, SharePoint, etc.), not on
        this service's own database. `mime_types` and `folder_id` are passed
        through to the connector as filters; `max_results` bounds the returned
        count (clamped to 1000) but is not a hard cursor — a source with more
        matching documents than `max_results` allows may still answer `413` if
        satisfying the filter needs more pages than the connector reads. Errors
        distinguish this service's own failures from the upstream source's:
        `502` for an unreachable or malformed upstream response, `429` for
        upstream rate-limiting.
      operationId: list_integration_documents
      parameters:
        - name: project_id
          in: path
          description: Project ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
        - name: integration_id
          in: path
          description: Integration ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
        - name: mime_types
          in: query
          description: Comma-separated MIME types to keep; empty keeps all
          required: false
          schema:
            type: string
        - name: folder_id
          in: query
          description: Source-specific folder ID to list
          required: false
          schema:
            type: string
        - name: max_results
          in: query
          description: Maximum number of documents (clamped to 1000)
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Documents visible through the connected source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocumentsResponse'
        "400":
          description: Invalid project or integration ID, or the integration has no connector for its kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized, or the source connection is missing or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden, or the source denied access to the folder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: The listing needs more pages than the connector reads; narrow `mime_types` or `folder_id`, or set `max_results`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Request fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: The source is rate-limiting the connector; retry after the `Retry-After` interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: The source returned an unexpected status, an unreadable response, or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearer_auth: []
  /v1/projects/{project_id}/integrations/{integration_id}/documents/{document_id}:
    get:
      tags:
        - integrations
      summary: Fetch one document's raw bytes through a connected source integration.
      description: |-
        Streams the document bytes with the source's MIME type in `Content-Type`
        and a sanitized filename in
        `Content-Disposition` — there is no JSON envelope on success. `document_id`
        is the source's own identifier, not one this service assigns. As with
        listing, errors distinguish this service's own failures from the
        upstream source's: `502` for an unreachable or malformed upstream
        response, `429` for upstream rate-limiting, `413` when the document
        exceeds what the connector reads.
      operationId: fetch_integration_document
      parameters:
        - name: project_id
          in: path
          description: Project ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
        - name: integration_id
          in: path
