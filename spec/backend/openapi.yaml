          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
    LoginResponse:
      type: object
      description: Successful login response
      required:
        - token
        - user
        - pending_invitations
      properties:
        pending_invitations:
          type: integer
          format: int32
          description: |-
            Number of pending invitations addressed to this user's email. Non-zero on first
            login when the user was invited; the frontend should route them to the
            accept-invitation page.
          example: 0
