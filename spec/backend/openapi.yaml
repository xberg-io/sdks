              description: Extraction result (only present when completed)
        status:
          type: string
          description: Job status
          example: completed
    SchemaCompliance:
      type: string
      description: |-
        Schema-validation outcome surfaced as one of three buckets.

        Fold into the combined confidence score without leaking internal validation
        error types.
      enum:
        - all_valid
        - partial_valid
        - all_invalid
    SetRagConfigRequest:
      type: object
      description: Request to set a project's RAG configuration (`PUT .../rag-config`).
      required:
