version: "3"

# ~keep The Go SDK ships ONE package (`xberg`) with ONE dual-target client, generated
# from THREE OpenAPI specs kept as separate schema sets in the same package (never
# merged; see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml     -> packages/go/generated_api.go     (Xberg Enterprise data plane + shared)
#   - spec/pro/openapi.yaml     -> packages/go/generated_pro.go     (Xberg Pro-only)
#   - spec/backend/openapi.yaml -> packages/go/generated_backend.go (Enterprise control plane)
# No Go identifier may be declared twice in one package, so tools/oapi-schemaset-config
# splits what a later spec shares with an earlier one. An operation, or a schema whose
# two definitions generate IDENTICAL Go, is skipped by the later generation. A schema
# the specs declare with DIFFERENT structures cannot be skipped — that would hand the
# later set the earlier shape — so it is renamed behind a prefix (`Pro`, `Backend`) in
# a derived copy of that spec (packages/go/spec-{pro,backend}.gen.yaml), and
# oapi-codegen reads that copy. The vendored specs are left untouched so
# `task spec:check` still compares them byte-for-byte with upstream. Both the exclusion
# sets and the renames are DERIVED from the specs on every run — never hand-maintained
# — so a spec sync cannot leave them stale.
vars:
  PKG_DIR: packages/go
  TOOLS_DIR: tools/oapi-schemaset-config
  API_SPEC: spec/api/openapi.yaml
  PRO_SPEC: spec/pro/openapi.yaml
  BACKEND_SPEC: spec/backend/openapi.yaml
  PRO_CONFIG_BASE: oapi-codegen-pro.yaml
  PRO_CONFIG_DERIVED: oapi-codegen-pro.gen.yaml
  BACKEND_CONFIG_BASE: oapi-codegen-backend.yaml
  BACKEND_CONFIG_DERIVED: oapi-codegen-backend.gen.yaml
  # Written by oapi-schemaset-config beside each derived config; see tools/oapi-schemaset-config.
  PRO_SPEC_DERIVED: spec-pro.gen.yaml
  BACKEND_SPEC_DERIVED: spec-backend.gen.yaml
  CONFIG_TOOL: github.com/xberg-io/sdks/tools/oapi-schemaset-config

tasks:
  generate:
    desc: "Regenerate all three Go schema sets (Enterprise + Pro + control plane) via oapi-codegen"
    dir: "{{.PKG_DIR}}"
    cmds:
      - |
        set -euo pipefail
        # ROOT_DIR is the repo root go-task resolved, so this survives PKG_DIR
        # moving depth. Counting `../` broke when packages/go/v1 became
        # packages/go and the spec was looked up a level above the repo.
        ROOT="{{.ROOT_DIR}}"
        go tool oapi-codegen --config oapi-codegen-api.yaml "$ROOT/{{.API_SPEC}}"
        go run {{.CONFIG_TOOL}} \
          -prior "$ROOT/{{.API_SPEC}}" \
          -spec "$ROOT/{{.PRO_SPEC}}" \
          -prefix Pro \
          -base "{{.PRO_CONFIG_BASE}}" \
          -out "{{.PRO_CONFIG_DERIVED}}"
        # The derived spec, not the vendored one: oapi-schemaset-config renames any
        # schema the two specs declare with different shapes, so both can live in one
        # package.
        go tool oapi-codegen --config "{{.PRO_CONFIG_DERIVED}}" "{{.PRO_SPEC_DERIVED}}"
        # The control plane is third, so both earlier sets are `-prior`. Pro is passed
        # as its DERIVED copy: the names that run moved behind a `Pro` prefix are what
        # the package declares, and the names it vacated are free here.
        go run {{.CONFIG_TOOL}} \
          -prior "$ROOT/{{.API_SPEC}}" \
          -prior "{{.PRO_SPEC_DERIVED}}" \
          -spec "$ROOT/{{.BACKEND_SPEC}}" \
          -prefix Backend \
          -base "{{.BACKEND_CONFIG_BASE}}" \
          -out "{{.BACKEND_CONFIG_DERIVED}}"
        go tool oapi-codegen --config "{{.BACKEND_CONFIG_DERIVED}}" "{{.BACKEND_SPEC_DERIVED}}"
      - go fmt ./...

  check:generated:
    desc: "Verify tracked Go sources match all three vendored specifications"
    cmds:
      - task: generate
      - git diff --exit-code -- packages/go/generated_api.go packages/go/generated_pro.go packages/go/generated_backend.go

  test:package:
    desc: "Build a consumer against the committed Go module without generation"
    cmds:
      - bash packages/go/test-package.sh

  install:
    desc: "Download Go module dependencies"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: "Compile Go module (verifies build, no artifact)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go build ./...

  test:tools:
    desc: "Run the codegen-tooling test suite (tools/oapi-schemaset-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go test -race ./...

  test:
    desc: "Run Go test suite"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -v ./...

  bench:crawl:
    desc: "Measure complete crawl SSE framing and decoding allocations"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go test -run '^$' -bench BenchmarkCrawlEventFrames -benchmem -count 3

  test:cov:
    desc: "Run Go tests with coverage"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:tools:
    desc: "Lint the codegen tooling (tools/oapi-schemaset-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go vet ./...

  lint:
    desc: "Lint Go sources (golangci-lint + govulncheck)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: lint:tools
      - golangci-lint run ./...
      - govulncheck ./...

  format:
    desc: "Format Go sources (gofmt)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go fmt ./...
