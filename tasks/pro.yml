version: "3"
tasks:
  up:
    desc: "Start an isolated shipping Pro container from PRO_IMAGE"
    cmds:
      - '"{{.ROOT_DIR}}/scripts/enterprise-stack.sh" --tier pro up'
  down:
    desc: "Stop only this SDK Pro stack, preserving volumes"
    cmds:
      - '"{{.ROOT_DIR}}/scripts/enterprise-stack.sh" --tier pro down'
  reset:
    desc: "Remove only this SDK Pro stack and its data volumes"
    cmds:
      - '"{{.ROOT_DIR}}/scripts/enterprise-stack.sh" --tier pro reset'
  key:
    desc: "Print this isolated Pro project's API key"
    silent: true
    cmds:
      - '"{{.ROOT_DIR}}/scripts/enterprise-stack.sh" --tier pro key'
  verify:
    desc: "Exercise actual Pro extraction, batch, saved presets and jobs through the SDK"
    cmds:
      - '"{{.ROOT_DIR}}/scripts/enterprise-stack.sh" --tier pro verify'
