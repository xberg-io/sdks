version: "3"

# ~keep The TypeScript SDK ships ONE package (`@xberg-io/sdk`) with ONE dual-target
# client, generated from THREE OpenAPI specs kept as separate schema sets (never
# merged; see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml     -> src/_generated/api.d.ts      (Enterprise data plane)
#   - spec/pro/openapi.yaml     -> src/_generated/pro.d.ts      (Xberg Pro)
#   - spec/backend/openapi.yaml -> src/_generated/backend.d.ts  (Enterprise control plane)
# Each set lands in its own module, so a name several specs share needs no
# renaming here — unlike the Go SDK, where all three share one package.
# The generated dir is gitignored; `generate` must run before `build`/`test`.
vars:
  PKG_DIR: packages/typescript

tasks:
  generate:
    desc: "Regenerate all three TypeScript schema sets (Enterprise + Pro + control plane)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - bash scripts/generate.sh

  install:
    desc: "Install TypeScript deps via pnpm"
    cmds:
      - pnpm install

  build:
    desc: "Regenerate schema types, then bundle TypeScript ESM + .d.ts via tsdown"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm exec tsdown

  test:
    desc: "Run TypeScript test suite (vitest)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - task: typecheck:contracts
      - pnpm run test

  test:cov:
    desc: "Run TypeScript tests with coverage"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - task: typecheck:contracts
      - pnpm run test:coverage

  lint:
    desc: "Lint TypeScript (oxlint + tsc --noEmit)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm run lint
      - task: typecheck:contracts

  typecheck:contracts:
    desc: "Type-check shared and Pro schema compatibility fixtures"
    dir: "{{.PKG_DIR}}"
    cmds:
      - pnpm exec tsc --noEmit -p tsconfig.contracts.json

  format:
    desc: "Format TypeScript (oxfmt)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - pnpm run format

  publish:
    desc: "Publish to npm with provenance"
    dir: "{{.PKG_DIR}}"
    cmds:
      - pnpm run build
      - pnpm publish --access public --provenance --no-git-checks
