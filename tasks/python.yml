version: "3"

# ~keep The Python SDK ships ONE package (`xberg_io_sdk`) with ONE dual-target client,
# generated from THREE OpenAPI specs kept as separate schema sets (never merged;
# see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml      -> src/xberg_io_sdk/_generated_api      (Enterprise data plane)
#   - spec/pro/openapi.yaml      -> src/xberg_io_sdk/_generated_pro      (Xberg Pro)
#   - spec/backend/openapi.yaml  -> src/xberg_io_sdk/_generated_backend  (Enterprise control plane)
# Each set lands in its own module, so a name three specs share needs no renaming
# here — unlike the Go SDK, where all three share one package.
vars:
  PKG_DIR: packages/python
  SRC_DIR: packages/python/src/xberg_io_sdk
  GEN_API: packages/python/src/xberg_io_sdk/_generated_api
  GEN_PRO: packages/python/src/xberg_io_sdk/_generated_pro
  GEN_BACKEND: packages/python/src/xberg_io_sdk/_generated_backend
  API_SPEC: spec/api/openapi.yaml
  PRO_SPEC: spec/pro/openapi.yaml
  BACKEND_SPEC: spec/backend/openapi.yaml

tasks:
  generate:
    desc: "Regenerate all three Python schema sets (Enterprise + Pro + control plane)"
    cmds:
      - task: _generate-one
        vars: { SPEC: "{{.API_SPEC}}", OUT: "{{.GEN_API}}" }
      - task: _generate-one
        vars: { SPEC: "{{.PRO_SPEC}}", OUT: "{{.GEN_PRO}}" }
      - task: _generate-one
        vars: { SPEC: "{{.BACKEND_SPEC}}", OUT: "{{.GEN_BACKEND}}" }
      # FormatMetadata discriminator patch. Guarded so it is a no-op when the
      # target spec has no FormatMetadata discriminator (e.g. Pro).
      - task: _patch-format-metadata
        vars: { SPEC: "{{.API_SPEC}}", OUT: "{{.GEN_API}}" }
      - task: _patch-format-metadata
        vars: { SPEC: "{{.PRO_SPEC}}", OUT: "{{.GEN_PRO}}" }
      - task: _patch-format-metadata
        vars: { SPEC: "{{.BACKEND_SPEC}}", OUT: "{{.GEN_BACKEND}}" }

  _generate-one:
    internal: true
    cmds:
      - rm -rf {{.OUT}}
      - mkdir -p {{.OUT}}
      - uv run -m openapi_python_client generate
        --path {{.SPEC}}
        --config {{.PKG_DIR}}/openapi-python-client.yaml
        --output-path {{.OUT}}/_pkg
        --overwrite
        --meta none
      - mv {{.OUT}}/_pkg/* {{.OUT}}/
      - rmdir {{.OUT}}/_pkg
      - touch {{.OUT}}/__init__.py

  _patch-format-metadata:
    internal: true
    cmds:
      - |
        uv run python - <<'PY'
        from pathlib import Path

        from ruamel.yaml import YAML

        spec = YAML(typ="safe").load(Path("{{.SPEC}}"))
        schemas = (spec.get("components") or {}).get("schemas") or {}
        format_metadata = schemas.get("FormatMetadata")
        generated = Path("{{.OUT}}/models/metadata.py")
        # Guard: skip when the spec has no FormatMetadata discriminator or the
        # generated model file was not produced (e.g. the Pro schema set).
        if format_metadata is None or "discriminator" not in format_metadata or not generated.exists():
            print("FormatMetadata patch skipped for {{.OUT}} (no discriminator / no model)")  # noqa: T201
            raise SystemExit(0)
        mapping = format_metadata["discriminator"]["mapping"]
        text = generated.read_text()
        format_parser = "        def _parse_format_(\n"
        start = text.index(format_parser)
        end = text.index("        format_ = _parse_format_", start)
        if "format_metadata_types" not in text[start:end]:
            marker = "            if isinstance(data, Unset):\n                return data\n"
            insert_at = text.index(marker, start) + len(marker)
            entries = []
            for tag, ref in sorted(mapping.items()):
                class_name = ref.rsplit("/", 1)[-1]
                entries.append(f'                    "{tag}": {class_name},')
            block = (
                "\n"
                "            if isinstance(data, dict):\n"
                "                format_metadata_types = {\n"
                + "\n".join(entries)
                + "\n"
                "                }\n"
                "                parser = format_metadata_types.get(data.get(\"format_type\"))\n"
                "                if parser is not None:\n"
                "                    return parser.from_dict(data)\n"
            )
            text = text[:insert_at] + block + text[insert_at:]
        generated.write_text(text)
        print("FormatMetadata patch applied to {{.OUT}}")  # noqa: T201
        PY

  install:
    desc: "Install Python package and dev deps via uv"
    cmds:
      - uv sync

  build:
    desc: "Generate schema sets and build Python distributions (wheel + sdist)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - uv build

  test:
    desc: "Run Python test suite"
    cmds:
      - uv run -m pytest {{.PKG_DIR}}/tests -v

  test:cov:
    desc: "Run Python tests with coverage"
    cmds:
      - uv run pytest {{.PKG_DIR}}/tests --cov=xberg_io_sdk --cov-report=term --cov-report=html

  lint:
    desc: "Lint Python sources (ruff + mypy)"
    cmds:
      - uv run ruff check {{.PKG_DIR}}/src {{.PKG_DIR}}/tests
      - uv run mypy {{.PKG_DIR}}/src

  format:
    desc: "Format Python sources (ruff)"
    cmds:
      - uv run ruff format {{.PKG_DIR}}/src {{.PKG_DIR}}/tests
      - uv run ruff check --fix {{.PKG_DIR}}/src {{.PKG_DIR}}/tests

  publish:
    desc: "Publish wheel + sdist to PyPI (uses UV_PUBLISH_TOKEN or trusted publishing)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: build
      - uv publish "{{.ROOT_DIR}}/dist/*"
