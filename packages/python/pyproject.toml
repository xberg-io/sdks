[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
name = "xberg-io-sdk"
version = "0.5.0"
description = "Official Python client for the Xberg Enterprise and Xberg Pro document-processing APIs."
readme = "README.md"
keywords = ["client", "cloud", "document-extraction", "openapi", "sdk", "xberg"]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{ name = "Kreuzberg, Inc.", email = "contact@xberg.io" }]
authors = [{ name = "Kreuzberg, Inc.", email = "contact@xberg.io" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "attrs>=24.2",
  "httpx>=0.28.1",
  "python-dateutil>=2.9",
  "typing-extensions>=4.12; python_version<'3.11'",
]
urls.Changelog = "https://github.com/xberg-io/sdks/blob/main/CHANGELOG.md"
urls.Documentation = "https://docs.sdks.xberg.io"
urls.Homepage = "https://xberg.io"
urls.Issues = "https://github.com/xberg-io/sdks/issues"
urls.Repository = "https://github.com/xberg-io/sdks"

[tool.hatch]
build.targets.sdist.include = ["src/xberg_io_sdk/**", "README.md", "LICENSE", "pyproject.toml"]
build.targets.wheel.packages = ["src/xberg_io_sdk"]
