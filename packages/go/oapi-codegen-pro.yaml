# Base config for the Xberg Pro schema set, emitted into the shared `xberg`
# package alongside generated_api.go.
#
# This file is NOT passed to oapi-codegen directly. `task go:generate` runs
# tools/oapi-schemaset-config, which reads the Enterprise spec (already
# generated) and the Pro spec, and writes two files:
#
#   oapi-codegen-pro.gen.yaml  this file plus two derived lists:
#
#     exclude-schemas          the shared schema names whose two definitions
#                              generate IDENTICAL Go (already emitted into
#                              generated_api.go, so re-emitting them here would
#                              redeclare the type in the same package)
#     include-operation-ids    the operations the Pro spec declares and the
#                              Enterprise spec does not, so no shared
#                              operation's param/body types are emitted twice
#
#   spec-pro.gen.yaml          a copy of the Pro spec in which every shared
#                              schema the two specs declare with DIFFERENT
#                              structures — plus every schema that reaches one
#                              through a `$ref` — is renamed behind a `Pro`
#                              prefix. Excluding those would silently hand Pro
#                              the Enterprise shape instead. oapi-codegen reads
#                              this derived copy, never the vendored spec, which
#                              stays byte-identical to upstream so
#                              `task spec:check` keeps passing.
#
# Both lists and the renames are recomputed from the specs on every run, so a
# spec sync cannot leave them stale. Do not pin them here — oapi-schemaset-config
# rejects a base config that sets either list. The schema sets are never merged;
# mirrors xberg-enterprise ADR-0072.
package: xberg
output: generated_pro.go
generate:
  models: true
output-options:
  skip-prune: true

# ~keep Enum constants are named after their VALUE, not their type, so two schema
# sets in this one package can each emit a `Disabled`, `Extraction` or `Crawl`
# const and collide — which is exactly what a spec sync produced once Pro's job
# response grew a `job_type` discriminator. oapi-schemaset-config dedupes SCHEMA
# names but cannot see enum constants. Prefixing is enabled here and in the
# backend set, never in the Enterprise set: the Enterprise set is generated first
# and owns 141 of the 147 constants, so leaving it unprefixed keeps the public Go
# enum surface stable while the later sets move out of its way.
compatibility:
  always-prefix-enum-values: true
